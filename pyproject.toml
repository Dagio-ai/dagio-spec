[project]
name = "specify-cli"
version = "0.0.26"
description = "Specify CLI is a tooling to bootstrap Spec-Driven Development workflows and Architecture as Code. Based on GitHub SpecKit."
requires-python = ">=3.11"
dependencies = [
  "typer",
  "rich",
  "platformdirs",
  "readchar",
  "truststore>=0.10.4",
]

[project.scripts]
specify = "specify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/specify_cli/data/**"]

[tool.hatch.build]
include = ["src/specify_cli/data/**"]
 